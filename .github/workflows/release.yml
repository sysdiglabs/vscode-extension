name: Release Workflow

on:
  push:
    branches:
      - main

jobs:
  check-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2 # We only need the current and the previous commit

      - name: Check if the package.version has changed
        id: check_changes
        run: |
          if git diff --unified=0 main~ package.json | grep '"version":'; then
            echo "changes=detected" >> $GITHUB_OUTPUT
          else
            echo "changes=none" >> $GITHUB_OUTPUT
          fi

    outputs:
      changes: ${{ steps.check_changes.outputs.changes }}

  build:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.changes == 'detected'
    defaults:
      run:
        shell: nix develop --command bash -e {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      # - name: Run tests
      #   run: just test

      - name: Build VSIX file
        run: just vsix

      - name: Get current version
        id: version
        shell: bash
        run: echo "version=$(jq --raw-output '.version' package.json)" >> "$GITHUB_OUTPUT"

      - name: Create release
        id: create_release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false

      - name: Upload VSIX file
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./sysdig-vscode-ext.vsix
          asset_name: sysdig-vscode-ext.vsix
          asset_content_type: application/vsix

      - name: Publish VSIX to the marketplace
        run: just publish-vscode-marketplace ${{ secrets.AZURE_DEVOPS_PAT }}

      - name: Publish VSIX to Open VSX
        run: just publish-openvsx-registry ${{ secrets.OVSX_PAT }}
